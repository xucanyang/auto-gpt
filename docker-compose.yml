name: auto-gpt

services:
  app:
    image: ${APP_IMAGE:-auto-gpt:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION:-152.0.4}
        CAMOUFOX_RELEASE: ${CAMOUFOX_RELEASE:-beta.28}
    container_name: auto-gpt
    init: true
    restart: unless-stopped
    env_file:
      - /root/.openclaw/workspace/sub2api-account-center/.env
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      APP_ENABLE_SOLVER: "1"
      SOLVER_PORT: "8889"
      SOLVER_BIND_HOST: 0.0.0.0
      LOCAL_SOLVER_URL: http://127.0.0.1:8889
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-chromium}
      CHATGPT_BROWSER_ENGINE: ${CHATGPT_BROWSER_ENGINE:-patchright}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-}
    ports:
      - "8000:8000"
      - "127.0.0.1:8889:8889"
      - "${CLIPROXYAPI_PORT_BIND:-8317}:8317"
    volumes:
      - ${APP_RUNTIME_BIND:-./data}:/runtime
      - ${APP_EXT_TARGETS_BIND:-./_ext_targets}:/_ext_targets
      - ${APP_EXTERNAL_LOGS_BIND:-./external_logs}:/app/services/external_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - tempmail_internal
    shm_size: "1gb"

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2604:a880:2:d1:2::/80
  tempmail_internal:
    external: true
