# managed by proxy-manager / canonical security copy in /opt/auto-gpt/ops/nginx
server {
    listen 80;
    listen [::]:80;
    server_name auto-gpt.cccy.me;

    include /etc/nginx/snippets/auto-gpt-cloudflare-realip.conf;
    access_log /var/log/nginx/auto-gpt.cccy.me.access.log auto_gpt_admin;
    error_log /var/log/nginx/auto-gpt.cccy.me.error.log warn;

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name auto-gpt.cccy.me;

    include /etc/nginx/snippets/auto-gpt-cloudflare-realip.conf;
    ssl_certificate /root/ssl/cccy.me.crt;
    ssl_certificate_key /root/ssl/cccy.me.key;
    client_max_body_size 200m;
    access_log /var/log/nginx/auto-gpt.cccy.me.access.log auto_gpt_admin;
    error_log /var/log/nginx/auto-gpt.cccy.me.error.log warn;
    limit_req_status 429;
    limit_req_log_level notice;

    location ^~ /api/auth/ {
        if ($auto_gpt_reject_query_token) { return 400; }
        client_max_body_size 16k;
        limit_req zone=auto_gpt_auth burst=6 nodelay;
        include /etc/nginx/snippets/auto-gpt-proxy-common.conf;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        if ($auto_gpt_reject_query_token) { return 400; }
        limit_req zone=auto_gpt_auth burst=6 nodelay;
        include /etc/nginx/snippets/auto-gpt-proxy-common.conf;
        proxy_pass http://127.0.0.1:8000;
    }
}
