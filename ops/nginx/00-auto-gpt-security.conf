# Canonical logging and edge throttling for the three Auto-GPT admin sites.
# Deliberately logs $uri rather than $request_uri/$args so credentials can never
# be persisted from a query string.
log_format auto_gpt_admin escape=json
    '{'
      '"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"host":"$host",'
      '"client_ip":"$remote_addr",'
      '"peer_ip":"$realip_remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"'
    '}';

# An empty key is not accounted by limit_req, so ordinary API and page traffic
# remains unaffected. The backend also maintains the durable lockout state.
map $uri $auto_gpt_auth_limit_key {
    default "";
    ~^/api/auth/(?:login|verify-totp|setup)$ "$host|$binary_remote_addr";
}
limit_req_zone $auto_gpt_auth_limit_key zone=auto_gpt_auth:10m rate=12r/m;

# URL credentials are rejected at the edge even if an old browser bundle or a
# scanner attempts to use the retired EventSource access_token contract.
map $args $auto_gpt_reject_query_token {
    default 0;
    ~*(?:^|&)access_token= 1;
}
