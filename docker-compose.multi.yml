name: auto-gpt

services:
  phone-api-relay:
    image: ${APP_IMAGE:-auto-gpt:latest}
    container_name: phone-api-relay
    init: true
    restart: unless-stopped
    entrypoint: ["python", "-m", "services.phone_api_relay"]
    environment:
      TZ: Asia/Shanghai
      PHONE_API_RELAY_HOST: 0.0.0.0
      PHONE_API_RELAY_PORT: "8787"
      PHONE_API_RELAY_DB: /runtime/phone_api_relay.db
      PHONE_API_RELAY_ADMIN_TOKEN: ${PHONE_API_RELAY_ADMIN_TOKEN:?PHONE_API_RELAY_ADMIN_TOKEN is required}
      PHONE_API_RELAY_PUBLIC_ORIGIN: ${PHONE_API_RELAY_PUBLIC_ORIGIN:-https://phone-api.aa8.pl}
      PHONE_API_RELAY_ENABLED: ${PHONE_API_RELAY_ENABLED:-1}
    ports:
      - "127.0.0.1:8893:8787"
    volumes:
      - /opt/auto-gpt-relay:/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    networks:
      - default
    mem_limit: "256m"
    mem_reservation: "64m"
    pids_limit: 128

  auto-gpt:
    image: ${APP_IMAGE:-auto-gpt:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CAMOUFOX_VERSION: ${CAMOUFOX_VERSION:-152.0.4}
        CAMOUFOX_RELEASE: ${CAMOUFOX_RELEASE:-beta.28}
    container_name: auto-gpt
    # 主实例承载 auto-gpt.cccy.me，必须与 Plus / Plus2 一样常驻发布。
    init: true
    restart: unless-stopped
    env_file:
      - /root/.openclaw/workspace/sub2api-account-center/.env
      - ./.env
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      APP_INSTANCE_ID: auto-gpt
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-172.20.0.1/32}
      PHONE_API_RELAY_INTERNAL_URL: http://phone-api-relay:8787
      PHONE_API_RELAY_ADMIN_TOKEN: ${PHONE_API_RELAY_ADMIN_TOKEN:?PHONE_API_RELAY_ADMIN_TOKEN is required}
      SHARED_CONFIG_DB: /shared_config/shared_config.db
      APP_ENABLE_SOLVER: "1"
      SOLVER_PORT: "8889"
      SOLVER_BIND_HOST: 0.0.0.0
      LOCAL_SOLVER_URL: http://127.0.0.1:8889
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-camoufox}
      SOLVER_MAX_BROWSERS: ${SOLVER_MAX_BROWSERS_MAIN:-4}
      SOLVER_WARM_BROWSERS: ${SOLVER_WARM_BROWSERS_MAIN:-1}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-}
      AUTH_BROWSER_MAX_CONCURRENCY: ${AUTH_BROWSER_MAX_CONCURRENCY_MAIN:-2}
      WEB_SESSION_HOLD_MAX_SESSIONS: ${WEB_SESSION_HOLD_MAX_SESSIONS_MAIN:-2}
      AUTH_BROWSER_PID_RESERVE: ${AUTH_BROWSER_PID_RESERVE_MAIN:-0}
      AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS: ${AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS_MAIN:-0}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:${SOLVER_PORT_BIND_MAIN:-8889}:8889"
      - "127.0.0.1:${CLIPROXYAPI_PORT_BIND:-8317}:8317"
    volumes:
      - ./data:/runtime
      - ./shared_config:/shared_config
      - ./_ext_targets:/_ext_targets
      - ./external_logs:/app/services/external_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "openai-pay-submit:host-gateway"
    networks:
      - default
      - tempmail_internal
      - oaipay_internal
    shm_size: "1gb"
    # Browser memory may use the host; shared browser slots remain the primary
    # concurrency guard and the finite PID ceiling prevents process storms.
    pids_limit: 768

  auto-gpt-plus:
    image: ${APP_IMAGE:-auto-gpt:latest}
    # 三个业务实例共用统一镜像，运行数据仍由各自 bind mount 隔离。
    container_name: auto-gpt-plus
    init: true
    restart: unless-stopped
    env_file:
      - /root/.openclaw/workspace/sub2api-account-center/.env
      - /opt/auto-gpt-plus/.env
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      APP_INSTANCE_ID: auto-gpt-plus
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-172.20.0.1/32}
      PHONE_API_RELAY_INTERNAL_URL: http://phone-api-relay:8787
      PHONE_API_RELAY_ADMIN_TOKEN: ${PHONE_API_RELAY_ADMIN_TOKEN:?PHONE_API_RELAY_ADMIN_TOKEN is required}
      SHARED_CONFIG_DB: /shared_config/shared_config.db
      APP_ENABLE_SOLVER: "1"
      SOLVER_PORT: "8889"
      SOLVER_BIND_HOST: 0.0.0.0
      LOCAL_SOLVER_URL: http://127.0.0.1:8889
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-camoufox}
      SOLVER_POOL_MODE: ${SOLVER_POOL_MODE_PLUS:-auto}
      SOLVER_MAX_BROWSERS: ${SOLVER_MAX_BROWSERS_PLUS:-5}
      SOLVER_WARM_BROWSERS: ${SOLVER_WARM_BROWSERS_PLUS:-0}
      SOLVER_IDLE_TIMEOUT_SECONDS: ${SOLVER_IDLE_TIMEOUT_SECONDS_PLUS:-300}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-}
      AUTH_BROWSER_CAPACITY_MODE: ${AUTH_BROWSER_CAPACITY_MODE_PLUS:-adaptive}
      AUTH_BROWSER_MAX_CONCURRENCY: ${AUTH_BROWSER_MAX_CONCURRENCY_PLUS:-10}
      WEB_SESSION_HOLD_MAX_SESSIONS: ${WEB_SESSION_HOLD_MAX_SESSIONS_PLUS:-4}
      AUTH_BROWSER_PID_RESERVE: ${AUTH_BROWSER_PID_RESERVE_PLUS:-220}
      AUTH_BROWSER_PID_EMERGENCY_RESERVE: ${AUTH_BROWSER_PID_EMERGENCY_RESERVE_PLUS:-256}
      AUTH_BROWSER_HOST_MEMORY_RESERVE_MIB: ${AUTH_BROWSER_HOST_MEMORY_RESERVE_MIB_PLUS:-6144}
      AUTH_BROWSER_CPU_PSI_AVG10_LIMIT: ${AUTH_BROWSER_CPU_PSI_AVG10_LIMIT_PLUS:-20}
      AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS: ${AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS_PLUS:-4}
    depends_on:
      phone-api-relay:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:8890:8889"
      - "127.0.0.1:${CLIPROXYAPI_PORT_BIND_PLUS:-8318}:8317"
    volumes:
      - /opt/auto-gpt-plus/data:/runtime
      - /opt/auto-gpt/shared_config:/shared_config
      - /opt/auto-gpt-plus/_ext_targets:/_ext_targets
      - /opt/auto-gpt-plus/external_logs:/app/services/external_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "openai-pay-submit:host-gateway"
    networks:
      - default
      - tempmail_internal
      - oaipay_internal
    shm_size: "2gb"
    # Plus can run ten staggered Auth browsers while retaining an emergency PID reserve.
    pids_limit: 3072

  auto-plus2:
    image: ${APP_IMAGE:-auto-gpt:latest}
    container_name: auto-plus2
    init: true
    restart: unless-stopped
    env_file:
      - /root/.openclaw/workspace/sub2api-account-center/.env
      - /opt/auto-plus2/.env
    environment:
      TZ: Asia/Shanghai
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      APP_INSTANCE_ID: auto-plus2
      APP_TRUSTED_PROXY_CIDRS: ${APP_TRUSTED_PROXY_CIDRS:-172.20.0.1/32}
      PHONE_API_RELAY_INTERNAL_URL: http://phone-api-relay:8787
      PHONE_API_RELAY_ADMIN_TOKEN: ${PHONE_API_RELAY_ADMIN_TOKEN:?PHONE_API_RELAY_ADMIN_TOKEN is required}
      SHARED_CONFIG_DB: /shared_config/shared_config.db
      APP_ENABLE_SOLVER: "1"
      SOLVER_PORT: "8889"
      SOLVER_BIND_HOST: 0.0.0.0
      LOCAL_SOLVER_URL: http://127.0.0.1:8889
      SOLVER_BROWSER_TYPE: ${SOLVER_BROWSER_TYPE:-camoufox}
      SOLVER_MAX_BROWSERS: ${SOLVER_MAX_BROWSERS_PLUS2:-4}
      SOLVER_WARM_BROWSERS: ${SOLVER_WARM_BROWSERS_PLUS2:-1}
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-}
      AUTH_BROWSER_MAX_CONCURRENCY: ${AUTH_BROWSER_MAX_CONCURRENCY_PLUS2:-2}
      WEB_SESSION_HOLD_MAX_SESSIONS: ${WEB_SESSION_HOLD_MAX_SESSIONS_PLUS2:-2}
      AUTH_BROWSER_PID_RESERVE: ${AUTH_BROWSER_PID_RESERVE_PLUS2:-0}
      AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS: ${AUTH_BROWSER_LAUNCH_INTERVAL_SECONDS_PLUS2:-0}
    depends_on:
      phone-api-relay:
        condition: service_healthy
    ports:
      - "127.0.0.1:8003:8000"
      - "127.0.0.1:8892:8889"
      - "127.0.0.1:${CLIPROXYAPI_PORT_BIND_PLUS2:-8320}:8317"
    volumes:
      - /opt/auto-plus2/data:/runtime
      - /opt/auto-gpt/shared_config:/shared_config
      - /opt/auto-plus2/_ext_targets:/_ext_targets
      - /opt/auto-plus2/external_logs:/app/services/external_logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "openai-pay-submit:host-gateway"
    networks:
      - default
      - tempmail_internal
      - oaipay_internal
    shm_size: "1gb"
    pids_limit: 768

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.20.0.0/16
        - subnet: 2604:a880:2:d1:2::/80
  tempmail_internal:
    external: true
  oaipay_internal:
    external: true
    name: app_default
